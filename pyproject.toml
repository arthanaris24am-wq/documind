[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "mlruns",
    "mlartifacts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

