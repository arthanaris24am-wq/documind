app:
  name: "DocuMind"
  host: "0.0.0.0"
  port: 8000

chunking:
  chunk_size: 500
  chunk_overlap: 50

retrieval:
  top_k: 4
  use_reranker: false
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  rerank_candidate_multiplier: 3

embeddings:
  model_name: "BAAI/bge-small-en-v1.5"
  normalize_embeddings: true
  device: "cpu"

qdrant:
  mode: "memory" # Options: memory, docker, cloud
  host: "localhost"
  port: 6333
  collection_name: "documind_docs"

llm:
  provider: "gemini"
  model_name: "gemini-2.0-flash"
  temperature: 0.1
  max_output_tokens: 1024
  max_retries: 4
  base_delay_seconds: 1.0
  max_delay_seconds: 16.0

